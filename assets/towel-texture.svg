<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <filter id="terry" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045 0.045" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
    <feDiffuseLighting in="noise" surfaceScale="6" diffuseConstant="1.25" lighting-color="#ffffff" result="light">
      <feDistantLight azimuth="235" elevation="48"/>
    </feDiffuseLighting>
    <feComponentTransfer in="light" result="contrast">
      <feFuncR type="linear" slope="1.5" intercept="-0.3"/>
      <feFuncG type="linear" slope="1.5" intercept="-0.3"/>
      <feFuncB type="linear" slope="1.5" intercept="-0.3"/>
    </feComponentTransfer>
  </filter>
  <rect width="300" height="600" filter="url(#terry)"/>
</svg>
